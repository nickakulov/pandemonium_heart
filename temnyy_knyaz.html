<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30 дней Завета</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=UnifrakturMaguntia&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="particles"></canvas>
<canvas id="ripples"></canvas>
<div id="vignette"></div>

<div id="day-counter">ДЕНЬ <b>0</b> ИЗ ВЕЧНОСТИ</div>

<div id="controls">
  <div class="ctrl-btn" id="mute-btn">🔊</div>
</div>

<div id="start-screen">
  <span>Нажми, чтобы инициировать протокол</span>
</div>

<div id="stage">
  <div id="terminal"></div>
  <div id="skip-hint">клик по тексту — ускорить строку</div>
  <div id="finale">
    <div id="demon-wrap">
      <div id="demon-img">
        <!-- Замени этот div на <img src="demon.png" alt="демон" style="width:100%;height:100%;object-fit:contain;"> -->
        <div id="demon-placeholder"></div>
        <div id="heart"></div>
      </div>
    </div>
    <div id="signature">От твоего Тёмного Князя с любовью.</div>
    <button id="replay-btn">Пережить снова</button>
  </div>
</div>

<!-- Плейсхолдер музыки: положи файл music.mp3 рядом с этим html-файлом -->
<audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

<script src="script.js"></script>
</body>
</html>
